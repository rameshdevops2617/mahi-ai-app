name: MAHI AI CI Pipeline

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from Git tag
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mahi-backend:${{ env.VERSION }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/mahi-backend:${{ env.VERSION }}

      - name: Update GitOps Repo (Canary)
        run: |
          git clone https://github.com/<YOUR_GITHUB_USERNAME>/mahi-ai-gitops.git
          cd mahi-ai-gitops
          sed -i "s/IMAGE_TAG/${{ env.VERSION }}/g" k8s/overlays/canary/deployment-patch.yaml
          git config user.name "GitHub Actions"
          git config user.email "ci@github.com"
          git commit -am "Canary deploy ${{ env.VERSION }}"
          git push
