name: MAHI AI CI Pipeline

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout application code
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2️⃣ Extract version from Git tag
      - name: Extract version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # 3️⃣ Docker Hub login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build & push backend image
      - name: Build & Push Backend
        run: |
          docker build \
            -t rameshcloud/mahi-backend:${{ env.VERSION }} \
            ./backend

          docker push rameshcloud/mahi-backend:${{ env.VERSION }}

      # 5️⃣ Update GitOps repo (Kustomize image tag)
      - name: Update GitOps Repo (Canary)
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/rameshdevops2617/mahi-ai-gitops.git
          cd mahi-ai-gitops

          sed -i "s/newTag:.*/newTag: ${{ env.VERSION }}/" \
            k8s/overlays/canary/kustomization.yaml

          git config user.name "GitHub Actions"
          git config user.email "ci@github.com"

          git add .
          git commit -m "Canary deploy MAHI AI ${{ env.VERSION }}"
          git push
