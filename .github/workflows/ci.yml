name: MAHI AI CI Pipeline

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout application repo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Extract version from Git tag (v1, v1.1, v2...)
      - name: Extract version from Git tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # 3️⃣ Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build & Push Backend Docker Image
      - name: Build & Push Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/mahi-backend:${{ env.VERSION }} \
            ./backend

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/mahi-backend:${{ env.VERSION }}

      # 5️⃣ Clone GitOps repo & update Canary image tag
      - name: Update GitOps Repo (Canary Deployment)
        run: |
          git clone https://github.com/rameshdevops2617/mahi-ai-gitops.git
          cd mahi-ai-gitops

          sed -i "s/IMAGE_TAG/${{ env.VERSION }}/g" \
            k8s/overlays/canary/deployment-patch.yaml

          git config user.name "GitHub Actions"
          git config user.email "ci@github.com"

          git add .
          git commit -m "Canary deploy MAHI AI ${{ env.VERSION }}"
          git push
