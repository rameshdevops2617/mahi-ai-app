name: MAHI AI CI Pipeline

on:
  push:
    tags:
      - "v*"

env:
  DOCKER_NAMESPACE: rameshcloud

jobs:
  build-and-canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Extract version from Git tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        run: |
          docker build -t $DOCKER_NAMESPACE/mahi-backend:${{ env.VERSION }} ./backend
          docker push $DOCKER_NAMESPACE/mahi-backend:${{ env.VERSION }}

      - name: Build & Push Frontend Image
        run: |
          docker build -t $DOCKER_NAMESPACE/mahi-frontend:${{ env.VERSION }} ./frontend
          docker push $DOCKER_NAMESPACE/mahi-frontend:${{ env.VERSION }}

      - name: Update GitOps Repo (Canary)
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/rameshdevops2617/mahi-ai-gitops.git
          cd mahi-ai-gitops

          sed -i "s/newTag:.*/newTag: ${{ env.VERSION }}/" k8s/overlays/canary/kustomization.yaml

          git config user.name "GitHub Actions"
          git config user.email "ci@github.com"

          if ! git diff --quiet; then
            git add .
            git commit -m "Canary deploy MAHI AI ${{ env.VERSION }}"
            git push
          else
            echo "Canary already at version ${{ env.VERSION }} – skipping commit"
          fi

  promote-to-stable:
    needs: build-and-canary
    runs-on: ubuntu-latest

    steps:
      - name: Promote Canary to Stable
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/rameshdevops2617/mahi-ai-gitops.git
          cd mahi-ai-gitops

          sed -i "s/newTag:.*/newTag: ${{ env.VERSION }}/" k8s/overlays/stable/kustomization.yaml

          git config user.name "GitHub Actions"
          git config user.email "ci@github.com"

          if ! git diff --quiet; then
            git add .
            git commit -m "Promote MAHI AI ${{ env.VERSION }} to stable"
            git push
          else
            echo "Stable already at version ${{ env.VERSION }} – skipping promotion"
          fi
